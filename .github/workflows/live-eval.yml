name: Live Eval

# The golden eval against a real LLM (tests/evals/test_golden.py): one
# fresh report per golden case (tests/evals/golden.py), every number in
# the prose checked against the report's claims. Suite "options" runs
# the options page's cited read instead (tests/evals/test_options_read.py,
# three tickers); "all" runs both. Suite "review" measures the AI PR
# review instead (scripts/ai_review_eval.py): past PRs replayed at their
# first reviewed commit, reviewed by main's script and this ref's, the
# findings and tokens uploaded as an artifact to grade by hand:
#
#   gh workflow run live-eval.yml --ref <branch> -f suite=review -f prs="128 129 130 131"
#
# Suite "review-verify" checks the review's second look against findings
# already labelled (tests/evals/ai_review_findings.json).
#
# It costs money (about a cent per report on DeepSeek) and calls the
# live data providers, so it never runs on a push. Start it by hand
# before merging a change to report content — prompts, claims, tools,
# the thesis:
#
#   Actions tab → Live Eval → Run workflow
#   gh workflow run live-eval.yml -f provider=deepseek
#   gh workflow run live-eval.yml -f provider=deepseek -f suite=options
#
# Required repo secret (Settings → Secrets and variables → Actions):
#   DEEPSEEK_API_KEY   for provider "deepseek" (what production runs)
#   ANTHROPIC_API_KEY  for provider "anthropic"
# Optional:
#   EDGAR_USER_AGENT   "Name email" — SEC asks for a monitored address
#   FRED_API_KEY       without it the Macro section has no values
#
# A failure here can also be the runner, not the model: Yahoo sometimes
# rate-limits cloud IPs, which empties sections. The log prints each
# case's sections and factuality, so read it before blaming a prompt.

on:
  workflow_dispatch:
    inputs:
      provider:
        description: LLM provider to evaluate
        type: choice
        options:
          - deepseek
          - anthropic
        default: deepseek
      suite:
        description: What to evaluate
        type: choice
        options:
          - research
          - options
          - all
          - review
          - review-verify
        default: research
      prs:
        description: PR numbers to replay (suite "review" only)
        type: string
        default: "128 129 130 131"

permissions:
  contents: read

# One eval at a time: runs share the providers' rate limits.
concurrency:
  group: live-eval
  cancel-in-progress: false

jobs:
  golden:
    name: Golden eval (${{ inputs.provider }})
    if: inputs.suite != 'review' && inputs.suite != 'review-verify'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eval_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/eval_db
      LLM_PROVIDER: ${{ inputs.provider }}
      # The API keys are set only on the steps that use them, not here: the
      # install steps run third-party code (security review, #114).
      # An unset secret is an empty string, which would replace the
      # code default and get every SEC request refused.
      EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT || 'Market Analysis Agent admin@example.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install deps
        run: uv sync

      # The golden test skips itself when the key is missing, and a
      # skipped run would show green. Fail instead.
      - name: Check the provider key is set
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "$LLM_PROVIDER" = "deepseek" ] && [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::error::The DEEPSEEK_API_KEY repo secret is not set."
            exit 1
          fi
          if [ "$LLM_PROVIDER" = "anthropic" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::The ANTHROPIC_API_KEY repo secret is not set."
            exit 1
          fi

      # fetch_news reads and writes through the app's own engine, so
      # the schema has to exist (unit tests build theirs per test).
      - name: Create the schema
        run: uv run alembic upgrade head

      - name: Golden eval
        if: inputs.suite != 'options'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          set -o pipefail
          uv run pytest -m live_llm tests/evals/test_golden.py -v -s | tee -a eval.log

      - name: Options read eval
        if: inputs.suite != 'research'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          uv run pytest -m live_llm tests/evals/test_options_read.py -v -s | tee -a eval.log

      - name: Summary
        if: always()
        # Through the environment, not interpolated into the script.
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          {
            echo "### Live eval (${LLM_PROVIDER}, ${SUITE})"
            echo '```'
            grep -E "factuality=|PASSED|FAILED|SKIPPED|passed|failed" eval.log || echo "no results in the log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  review:
    name: AI review eval
    if: inputs.suite == 'review' || inputs.suite == 'review-verify'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Replay past PRs through both reviews
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          # Through the environment, not interpolated into the script.
          PRS: ${{ inputs.prs }}
          SUITE: ${{ inputs.suite }}
        run: |
          case "$PRS" in *[!0-9\ ]*) echo "::error::prs takes PR numbers only."; exit 1;; esac
          if [ "$SUITE" = "review-verify" ]; then
            python scripts/ai_review_eval.py --verify tests/evals/ai_review_findings.json --out review-eval.json
          else
            # shellcheck disable=SC2086 # one argument per PR number
            python scripts/ai_review_eval.py $PRS --out review-eval.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-eval
          path: review-eval.json
          if-no-files-found: warn
