name: AI Review

# DeepSeek reads each pull request for what its author missed and posts
# one comment, rewritten each time (scripts/ai_review.py). Claude writes
# most of this code, so the second read comes from a different model.
# Advisory: it comments, it never blocks a merge on its findings.
#
# - A full review, in parts, when a PR opens, is reopened or marked ready
#   for review, or gets the "ai-review-full" label (remove and add it
#   again to re-run).
# - Each later push reviews only what changed since the last review, shown
#   the earlier findings and the author's replies (PR comments marked
#   <!-- ai-review:reply -->, from people who can push).
#
# Needs the DEEPSEEK_API_KEY repo secret (the one the Live Eval uses) and
# fails without it rather than passing having reviewed nothing.
#
# Only PRs from branches of this repo: GitHub withholds secrets from fork
# PRs anyway. The script that runs is the PR's own copy, so anyone who can
# push a branch here can run code with DEEPSEEK_API_KEY. That is
# deliberate, not an oversight: the same person can already edit this
# file in their PR and print any repo secret, so running the base copy of
# the script would protect nothing. Today only the owner can push. Revisit
# (pull_request_target + base checkout, or an environment with required
# reviewers) if collaborators are added.

on:
  pull_request:
    branches: ["main"]
    types: [opened, reopened, ready_for_review, synchronize, labeled]

permissions: {}

jobs:
  ai-review:
    name: AI — PR Review (DeepSeek)
    runs-on: ubuntu-latest
    # Another label is no reason to review.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' || github.event.label.name == 'ai-review-full')
    # Up to 8 parts, four at a time, each with a thinking attempt and a
    # plain one of up to 5 minutes.
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
    # A new push replaces the review still running for the last one; the
    # next review starts from the last one that finished.
    concurrency:
      group: ai-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Review the pull request
        run: python scripts/ai_review.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
