# Daily IV snapshot (ADR 0008).
#
# After each US close, asks the API to store each tracked ticker's option
# IV figures for the day: no free source has IV history, so this table is
# it, and a day missed is gone. A second run later the same night fills
# any gap; both are idempotent, and a weekend or holiday run stores
# nothing ("no_new_session").
#
# Times are UTC and off the hour (GitHub delays or drops schedules at :00):
#   22:17 Mon-Fri = 17:17 ET in winter, 18:17 in summer;
#   00:47 Tue-Sat = 19:47 / 20:47 ET the same evening.
# Run it by hand with:  gh workflow run iv-snapshot.yml
#
# Needs the repository variable API_BASE_URL (https://market-analysis-agent.fly.dev)
# and the secret BACKEND_SHARED_SECRET (the API's shared secret; docs/deployment.md).
# The job fails when the market was open, when there were no tickers at
# all, or when any configured ticker (OPTIONS_SNAPSHOT_SYMBOLS) still has
# no row for the session ("missing"): a quiet day lost is the failure this
# table can't afford. Tickers added from page views are best-effort. The
# step summary lists what happened.

name: IV Snapshot

on:
  schedule:
    - cron: "17 22 * * 1-5"
    - cron: "47 0 * * 2-6"
  workflow_dispatch:

permissions: {}

concurrency:
  group: iv-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      BACKEND_SHARED_SECRET: ${{ secrets.BACKEND_SHARED_SECRET }}
    steps:
      - name: Check the configuration
        run: |
          if [ -z "$API_BASE_URL" ] || [ -z "$BACKEND_SHARED_SECRET" ]; then
            echo "::error::Set the API_BASE_URL repository variable and the BACKEND_SHARED_SECRET secret (docs/deployment.md)."
            exit 1
          fi

      # Fly stops the machine when idle and Neon suspends the database; the
      # health check wakes both before the real call.
      - name: Wake the API and the database
        run: curl -fsS --retry 6 --retry-connrefused --retry-delay 5 --max-time 30 "$API_BASE_URL/v1/health" > /dev/null

      - name: Take the snapshots
        run: |
          # The run stops itself at 300 s; one retry, each attempt capped at
          # 360 s, fits the job's 20 minutes with time left for the summary.
          curl -fsS --retry 1 --retry-delay 20 --max-time 360 -X POST \
            -H "Authorization: Bearer $BACKEND_SHARED_SECRET" \
            "$API_BASE_URL/v1/options/snapshots" -o run.json

      - name: Check the run
        run: |
          jq . run.json
          status=$(jq -r .status run.json)
          count() { jq "[.$1[]] | length" run.json; }
          targets=$(count targets); written=$(count written); skipped=$(count skipped)
          # Totals failures ("totals: ...") are counted on their own line.
          failed=$(jq '[.failed[] | select(.reason | startswith("totals:") | not)] | length' run.json)
          deferred=$(count deferred)
          totals_failed=$(jq '[.failed[] | select(.reason | startswith("totals:"))] | length' run.json)
          no_options=$(count no_options); no_quotes=$(count no_usable_quotes)
          totals_written=$(jq '[.totals_written[]?] | length' run.json)
          totals_deferred=$(jq '[.totals_deferred[]?] | length' run.json)
          {
            echo "### IV snapshot: $status ($(jq -r '.session_date // "no session"' run.json))"
            echo ""
            echo "| targets | written | already stored | failed | deferred | no options | no usable quotes |"
            echo "|---|---|---|---|---|---|---|"
            echo "| $targets | $written | $skipped | $failed | $deferred | $no_options | $no_quotes |"
            echo ""
            echo "Whole-chain open interest (best-effort): $totals_written written, $totals_deferred deferred, $totals_failed failed."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" = "market_open" ]; then
            echo "::error::The market was open; the run stored nothing."
            exit 1
          fi
          if [ "$targets" -eq 0 ]; then
            echo "::error::No tickers to snapshot: is OPTIONS_SNAPSHOT_SYMBOLS set?"
            exit 1
          fi
          missing=$(jq -r '.missing | join(", ")' run.json)
          if [ -n "$missing" ]; then
            echo "::error::No row for the session for: $missing"
            exit 1
          fi
