# Fly.io config for the Market Analysis Agent API.
# See docs/adr/0002-deployment.md for the rationale behind these choices
# and docs/deployment.md for the first-time setup + ongoing-ops runbook.

app = 'market-analysis-agent'
primary_region = 'iad'          # US East (Ashburn). Pair with a Neon region
                                # in us-east-1 / us-east-2 for <10ms DB latency.
kill_signal = 'SIGINT'          # uvicorn responds to SIGINT with graceful shutdown
kill_timeout = '10s'            # give in-flight requests time to drain

[build]
  dockerfile = 'Dockerfile'

[env]
  APP_ENV = 'prod'
  PORT = '8000'
  TZ = 'UTC'
  # The Vercel dashboard's origin — the only one CORS lets the browser
  # call from (exact match, no trailing slash). Public, so it lives here.
  FRONTEND_ORIGIN = 'https://market-analysis-agent-red.vercel.app'
  # ADR 0006. Needs the DEEPSEEK_API_KEY secret; switch back to Claude
  # with 'anthropic' + the ANTHROPIC_API_KEY secret.
  LLM_PROVIDER = 'deepseek'
  # Fresh reports per IP per hour (cache hits are free). The code default
  # is 3; raised for the Phase 4.8 dogfood phase, when the owner is the
  # only user and needs many fresh reports. The shared secret gates the
  # endpoint and a DeepSeek report costs under a cent, so 30/h caps the
  # worst case near $0.30/h. Lower it before sharing the URL publicly.
  RESEARCH_RATE_LIMIT_PER_HOUR = '30'
  # Secrets — set via `flyctl secrets set ...`, never hardcoded here:
  #   DATABASE_URL, BACKEND_SHARED_SECRET, DEEPSEEK_API_KEY
  #   (optional: ANTHROPIC_API_KEY, FRED_API_KEY, NEWSAPI_KEY).
  # A secret with the same name as a key above overrides it.

[http_service]
  internal_port = 8000
  force_https = true
  # Scale to zero when idle. Wake on the next request (~1s cold start).
  # Flip `auto_stop_machines = "off"` and `min_machines_running = 1` if
  # recruiter-grade instant response starts mattering more than the ~$2/mo
  # always-on cost.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 50              # refuse beyond this; triggers autoscale-up
    soft_limit = 40              # signal "consider another machine"

  # Health check. Path matches our real DB-probing endpoint so if Postgres
  # is unreachable, Fly marks the machine unhealthy and doesn't route traffic.
  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'         # alembic upgrade + uvicorn boot window
    method = 'GET'
    path = '/v1/health'
    protocol = 'http'

# 512 MB is comfortable for FastAPI + pandas/numpy (yfinance pulls them in).
# Shared CPU is fine for this workload — the hot path is external I/O.
# Monthly cost at always-on: ~$1.94. With auto_stop_machines it'll be
# pennies until real traffic.
[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
